name: Snippet checks

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  extract-sdk-version:
    name: Extract SDK version
    runs-on: ubuntu-latest
    outputs:
      sdk-version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract SDK version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').dependencies['@wraith-protocol/sdk']")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected SDK version: $VERSION"

  check-snippets:
    name: Compile docs snippets
    runs-on: ubuntu-latest
    needs: extract-sdk-version
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Download published SDK artifact
        run: |
          echo "Downloading @wraith-protocol/sdk@${{ needs.extract-sdk-version.outputs.sdk-version }}"
          cd /tmp
          npm pack @wraith-protocol/sdk@${{ needs.extract-sdk-version.outputs.sdk-version }}

      - name: Install dependencies with pinned SDK
        run: |
          pnpm install --frozen-lockfile
          pnpm remove @wraith-protocol/sdk
          pnpm add /tmp/wraith-protocol-sdk-${{ needs.extract-sdk-version.outputs.sdk-version }}.tgz

      - name: Record tested SDK version
        run: |
          echo "Testing against SDK version: ${{ needs.extract-sdk-version.outputs.sdk-version }}"

      - name: Check snippets
        run: pnpm run check:snippets

      - name: Check integration guides
        run: pnpm run check:integration-guides

      - name: Check placeholders
        run: pnpm run check:placeholders

      - name: Check nav coverage
        run: pnpm run check:nav-coverage

      - name: Check contract registry
        run: pnpm run check:contract-registry

      - name: Check redirects and anchors
        env:
          DOCS_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DOCS_DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm run check:redirects-and-anchors

      - name: Test redirects and anchors check
        run: pnpm run test:redirects-and-anchors

  check-snippets-extended:
    name: Compile Rust / Python / shell / config snippets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Rust — pinned stable toolchain for reproducibility.
      # -----------------------------------------------------------------------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.78.0"

      # -----------------------------------------------------------------------
      # Python — pinned minor version; patch resolved by setup-python.
      # -----------------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # bash is already present on ubuntu-latest; print versions for the log.
      - name: Verify toolchains
        run: |
          rustc --version
          python3 --version
          bash --version | head -1

      - name: Check extended snippets (Rust / Python / shell / JSON / TOML / YAML)
        run: pnpm run check:snippets-extended

  # ---------------------------------------------------------------------------
  # Stellar testnet snippet validation — split into two steps so that
  # deterministic content regressions block merges while provider outages
  # are surfaced as annotations without blocking.
  #
  # Exit codes from check-stellar-testnet-snippets.ts:
  #   0  – passed
  #   1  – content regression   → always a hard failure
  #   2  – provider outage      → warning annotation, does NOT block merge
  # ---------------------------------------------------------------------------
  stellar-testnet-snippets:
    name: Stellar snippet testnet validation
    runs-on: ubuntu-latest
    # No top-level continue-on-error — individual steps control leniency.
    needs: extract-sdk-version
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Download published SDK artifact
        run: |
          echo "Downloading @wraith-protocol/sdk@${{ needs.extract-sdk-version.outputs.sdk-version }}"
          cd /tmp
          npm pack @wraith-protocol/sdk@${{ needs.extract-sdk-version.outputs.sdk-version }}

      - name: Install dependencies with pinned SDK
        run: |
          pnpm install --frozen-lockfile
          pnpm remove @wraith-protocol/sdk
          pnpm add /tmp/wraith-protocol-sdk-${{ needs.extract-sdk-version.outputs.sdk-version }}.tgz

      - name: Record tested SDK version
        run: |
          echo "Testing against SDK version: ${{ needs.extract-sdk-version.outputs.sdk-version }}"

      # BLOCKING: deterministic content checks only (snippet count, file
      # existence). A failure here means a real doc regression. Exit 1.
      - name: Validate Stellar snippet content (blocking)
        env:
          MODE: content
        run: pnpm run check:stellar-testnet

      # NON-BLOCKING: live provider availability checks. Failures here are
      # provider outages (exit 2) and emit a ::warning:: annotation without
      # failing the job. A genuine content-regression finding from a reachable
      # provider still exits 1 and fails the job.
      - name: Validate Stellar testnet provider availability (non-blocking)
        id: provider-check
        continue-on-error: true
        env:
          MODE: provider
        run: pnpm run check:stellar-testnet

      # Distinguish an outage (exit 2, warn only) from a real failure (exit 1,
      # which continue-on-error already surfaced as a warning annotation in the
      # previous step — re-fail the job here so the PR is blocked).
      - name: Fail job on content regression from provider step
        if: steps.provider-check.outcome == 'failure' && steps.provider-check.conclusion == 'failure'
        run: |
          echo "::error::Provider step exited with a content regression (exit 1). Failing the job."
          exit 1

  playground-smoke:
    name: Playground smoke test
    runs-on: ubuntu-latest
    needs: extract-sdk-version
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Download published SDK artifact
        run: |
          echo "Downloading @wraith-protocol/sdk@${{ needs.extract-sdk-version.outputs.sdk-version }}"
          cd /tmp
          npm pack @wraith-protocol/sdk@${{ needs.extract-sdk-version.outputs.sdk-version }}

      - name: Install dependencies with pinned SDK
        run: |
          pnpm install --frozen-lockfile
          pnpm remove @wraith-protocol/sdk
          pnpm add /tmp/wraith-protocol-sdk-${{ needs.extract-sdk-version.outputs.sdk-version }}.tgz

      - name: Record tested SDK version
        run: |
          echo "Testing against SDK version: ${{ needs.extract-sdk-version.outputs.sdk-version }}"

      - name: Verify playground fixtures are in sync
        run: pnpm run check:playground-fixtures

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run playground smoke tests
        run: pnpm run test:playground
